<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="Imagens/favicon.ico" type="image/x-icon">
    <title>Login Page</title>
</head>
<body>
    <main>
        <div class="container">
            <form class="form-login" method="post" autocomplete="on">
                <h1>Login</h1>
                <input type="email" placeholder="usuário@email.com" required>
                <input type="password" placeholder="Coloque sua senha" autocomplete="current-password" required minlength="8" maxlength="20">
                <a href="#">Esqueceu sua senha?</a>
                <button type="submit">Continuar</button>
                <p>Ou acesse diretamente usando:</p>
                <div class="social-icons">
                    <a href="#" class="icon" id="icon-google">
                        <img src="Imagens/google-circle.png" alt="Google">
                    </a>
                    <a href="#" class="icon" id="icon-facebook">
                        <img src="Imagens/facebook.png" alt="Facebook">
                    </a>
                    <a href="#" class="icon" id="icon-github">
                        <img src="Imagens/github.png" alt="GitHub">
                    </a>
                    <a href="#" class="icon" id="icon-linkedin">
                        <img src="Imagens/linkedin-circle.png" alt="LinkedIn">
                    </a>
                </div>
            </form>
            <form class="form-register" method="post" autocomplete="on">
                <h1>Registrar</h1>
                <input type="text" placeholder="nome de usuário" required>
                <input type="email" placeholder="usuário@email.com" required>
                <input type="password" placeholder="crie uma senha segura"  autocomplete="current-password" required minlength="8" maxlength="20">
                <button type="submit">Continuar</button>
            </form>
            <div class="background-login">
                <h1>Bem Vindo!</h1>
                <p>Registre sua conta agora para aproveitar todos os recursos!</p>
                <button type="button">Registrar</button>
                <div class="tabs-mobile">
                    <div class="tab-bkg"></div>
                    <button class="tab-btn" onclick="selectTab(0)" >Entrar</button>
                    <button class="tab-btn" onclick="selectTab(1)" >Cadastrar</button>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
